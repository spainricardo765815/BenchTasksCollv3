name: Build Finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build finalpool from implemented Notion tasks
        env:
          GH_REPO: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          BUILD_SPEC=(
            "fan-dev:fan:coupon-manager,discount-calculator,loyalty-program,price-tracker"
            "gyy:gyy:blog-engine,cms-builder,content-scheduler,robots-handler,sitemap-generator,social-publisher,tag-manager"
            "haoze:haoze:media-organizer,streaming-service,subtitle-generator,video-trimmer"
            "jl_dev:jl:canvas-grade-automation,customer-feedback-processor,email-classification-system,inventory-management,pdf-report-generator"
            "junteng_dev:junteng:booking-system,calendar-sync,contact-manager,customer-portal,help-desk,order-processor,product-catalog,reminder-service,shipment-tracker"
            "junxian_dev:junxian:qr-generator,social-connector,translation-api"
            "lueyang-dev:lueyang:activity-logger,client-portal,crm-system,deal-manager,email-campaign,follow-up-reminder,sales-pipeline,territory-manager"
            "lv:lv:analytics-dashboard,chat-bot,feedback-collector,personalization-service,sentiment-analyzer,survey-builder,voice-processor"
            "ruige:ruige:canvas-automation,data-analytics,expense-tracker,file-manager,log-analyzer,web-crawler"
            "wenshuo-dev:wenshuo:cache-optimizer,image-processor,scheduler,search-engine"
            "xiaochen_dev:xiaochen:backup-utility,deployment-tool,error-tracker,health-monitor,monitoring-agent,security-scanner,status-checker"
            "yuxuan-dev:yuxuan:asset-optimizer,content-manager,network-analyzer,sync-service,task-scheduler"
            "yuzhen-dev:yuzhen:alert-system,data-validator,form-builder,invoice-generator,payment-processor,permission-manager"
            "zhaochen:zhaochen:certificate-manager,load-balancer,storage-manager,template-engine"
          )

          git checkout -B finalpool origin/main
          rm -rf tasks/finalpool
          mkdir -p tasks/finalpool
          for spec in "${BUILD_SPEC[@]}"; do
            IFS=':' read -r branch owner tasklist <<<"$spec"
            if ! git rev-parse -q --verify "origin/$branch" >/dev/null; then
              git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            fi
            IFS=',' read -ra tasks <<<"$tasklist"
            for task in "${tasks[@]}"; do
              prefix="tasks/$owner/$task"
              echo "Adding $task from $branch:$prefix"
              if ! git cat-file -e "origin/$branch:$prefix" 2>/dev/null; then
                echo "Missing $branch:$prefix" >&2
                exit 1
              fi
              dest="tasks/finalpool/$task"
              mkdir -p "$dest"
              git archive "origin/$branch:$prefix" | tar -x -C "$dest"
            done
          done

          git add tasks/finalpool
          if git diff --cached --quiet; then
            echo "No finalpool changes to commit"
            exit 0
          fi
          git commit -m "Add implemented tasks to finalpool"
          git push origin HEAD:finalpool

          if [[ "$GH_REF_NAME" == "finalpool-build" ]]; then
            echo "Cleaning up temporary build branch"
            curl --fail --show-error --silent \
              --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/git/refs/heads/$GH_REF_NAME" || {
                echo "Warning: could not delete temporary build branch" >&2
              }
          fi